        <p>一个专科产品在中国的上市，被内容卡住了。英文材料翻过来，中国临床医生读着别扭；超说明书（off-label）标注前后不一致；销售赋能包在本地市场没有证据支撑。这个团队要的是一套内容生产机制，不是一个翻译窗口。</p>

      <ProseBlock heading="我们怎么做的" anchor="approach">

      </ProseBlock>
      <ProseBlock heading="结果" anchor="outcome">
        <p>上市团队拿到的是一套医生可以直接用的内容包，MSL 幻灯、KOL 会议与渠道材料都覆盖。医生一次通过率把修改轮次从通常的 4 轮，平均压到 2 轮。那层本地化能力沉淀了下来，后续产品线扩展可以直接复用。</p>
      </ProseBlock>
