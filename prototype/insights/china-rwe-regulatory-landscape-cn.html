        "中国把真实世界研究纳入药品监管的速度，超出了不少全球申办方的预期。2019 至 2023 年间，国家药监局（NMPA）及其药品审评中心（CDE）密集发布了一批指导原则，明确真实世界数据（RWD）与真实世界研究（RWE）可以如何支持药物研发、注册与上市后监测。起点是 2019 年的那份文件——《真实世界证据支持药物研发的基本考虑》（Basic Considerations of Real-World Evidence Supporting Drug Research and Development）——它奠定了概念基础；此后陆续出台的技术指导原则，进一步覆盖数据来源、研究设计与统计方法。",
        "这一轮监管推进不是孤立发生的。它的上游是国务院 2015–2016 年的大数据行动计划，该计划推动了公共卫生数据资源的开发与共享。ChinaREAL（中国真实世界数据与研究联盟）的成立，以及吴阶平医学基金会 2018 年发布的研究指南，则说明学术界与临床界正在与监管方同步建设能力。"
