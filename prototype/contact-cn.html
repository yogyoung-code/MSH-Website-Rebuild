    eyebrow: 'AI 平台 · 即将开放',
    title: '下一个 AI 产品开放时通知我。',
    body: '限量预览开放的那天，我们发一封邮件，仅此一封。不进营销名单，没有后续培育序列。',
  },
  ai_product_access: {
    eyebrow: 'AI 平台 · 限量预览',
    title: '申请 AI 产品限量预览。',
    body: '限量预览面向临床医生与在合作中的研究团队开放。申请我们在 5 个工作日内审完并回复。',
  },
  ai_reverse_dd: {
    eyebrow: 'AI 平台 · 技术深谈',
    title: '和我们的 AI 团队直接谈。',
    body: '能力核验、技术深度沟通，或合作模式探讨。AI 团队在 2 个工作日内回复，接你的是做这套系统的人。',

    eyebrow: '医生调研 · 立项',

  },
};

function getRoutedIntent() {
  if (typeof window === 'undefined') return null;
  const m = window.location.search.match(/[?&]intent=([^&]+)/);
  if (!m) return null;
  const v = decodeURIComponent(m[1]);
  return AI_INTENT_HEROS[v] ? v : null;
}

  const aiHero = routedIntent ? AI_INTENT_HEROS[routedIntent] : null;

    ['内部签核路径', '医学、法务、合规分别由谁签。这一条决定项目排期，越早说越好。'],

              fontSize: 12,
              letterSpacing: '0.16em',
              textTransform: 'uppercase',
              color: 'var(--brand-accent-700)',
              marginBottom: 16
            }}>{aiHero ? aiHero.eyebrow : '联系梅斯健康 MedSci Healthcare'}</div>

            <h1 style={{
              fontFamily: 'var(--font-display)',
              fontSize: 'clamp(32px, 4vw, 44px)',
              lineHeight: 1.2,
              color: 'var(--brand-primary-700)',
              margin: '0 0 20px'
            }}>{aiHero ? aiHero.title : '说清楚你要做的事，我们派对口的人来接。'}</h1>

            <p style={{
              fontSize: 16,
              color: 'var(--fg-1)',
              lineHeight: 1.65,
              margin: '0 0 32px',

              }
            </p>

            {/* 回复节奏 —— 中文读者最先问的三件事 */}
            <div style={{
              border: '1px solid var(--border-1)',
              borderRadius: 12,
              padding: '22px 24px',
              background: 'var(--bg-2)',
              marginBottom: 32,
            }}>

                fontFamily: 'var(--font-slogan)',

                width: '100%',
                height: 'clamp(200px, 30vw, 400px)',
                objectFit: 'cover',
                objectPosition: 'center 40%',

            position: 'absolute',
